<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Altimiras</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a2e40;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .player-wrapper {
            background: #121212;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Radio Altimiras</h1>
        <p>Transmisión en vivo</p>
        
        <div class="player-wrapper">
            <!-- Reproductor MyRadioStream -->
            <script src="//myradiostream.com/embed/Altimiras2001"></script>
        </div>
    </div>

    <footer>
        &copy; Altimiras Chile
    </footer>

</body>
</html>
