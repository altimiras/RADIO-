<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de reproductor — Radio Altimiras</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 18px;
      line-height: 1.5;
    }
    h1 { font-size: 1.35rem; }
    audio { width: 100%; margin-top: 12px; }
    #estado { color: #555; font-size: .95rem; }
  </style>
</head>
<body>
  <h1>Radio Altimiras — prueba de audio</h1>
  <p><strong>Agua salada</strong></p>
  <audio id="audio" controls preload="metadata">
    <source
      src="https://raw.githubusercontent.com/altimiras/Z/main/Mp3/Baladas/Agua%20salada.mp3"
      type="audio/mpeg">
    Tu navegador no puede reproducir audio MP3.
  </audio>
  <p id="estado">Esperando reproducción.</p>

  <script>
    const audio = document.getElementById("audio");
    const estado = document.getElementById("estado");

    audio.addEventListener("playing", () => {
      estado.textContent = "Reproduciendo correctamente.";
    });
    audio.addEventListener("pause", () => {
      if (!audio.ended) estado.textContent = "Reproducción pausada.";
    });
    audio.addEventListener("ended", () => {
      estado.textContent = "El archivo terminó.";
    });
    audio.addEventListener("error", () => {
      estado.textContent =
        "No se pudo cargar el MP3. Revisaremos el acceso al archivo.";
    });
  </script>
</body>
</html>
