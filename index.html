<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Radio Altimiras</title>
<style>
:root{--h:18;--acc:hsl(var(--h) 92% 62%);--ink:#f6f3ee;--mute:#b9b4ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0d14;color:var(--ink)}
body{font-family:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}

.bg{position:fixed;inset:-12%;background:#14101c center/cover no-repeat;filter:blur(46px) saturate(1.5) brightness(.5);transform:scale(1.15)}
.veil{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,transparent,rgba(8,9,14,.7)),linear-gradient(180deg,rgba(8,9,14,.3),rgba(8,9,14,.88))}

main{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));text-align:center}

header{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px}
.brand{font-weight:800;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:#6b6760}
.eq{display:flex;gap:3px;align-items:flex-end;height:16px}
.eq i{width:3px;height:25%;background:var(--acc);border-radius:2px}
body.on .live{color:var(--ink)}
body.on .dot{background:#ff3b30;animation:pulse 1.6s infinite}
body.on .eq i{animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}.eq i:nth-child(4){animation-delay:-.15s}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%;max-width:520px}
.art img{display:block;width:min(82vw,46dvh,440px);aspect-ratio:1;object-fit:cover;border-radius:20px;background:#1c1824;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12),0 0 90px hsl(var(--h) 90% 55% / .35);
  transition:opacity .6s,transform .6s}
.art img.hide{opacity:0;transform:scale(.96)}
body.on .art img:not(.hide){animation:breathe 7s ease-in-out infinite}

.genre{display:inline-block;padding:7px 18px;border-radius:999px;background:var(--acc);color:#1a0f08;font-weight:800;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase}
.genre:empty{display:none}
#title{margin:0;font-size:clamp(1.7rem,8vw,2.8rem);font-weight:800;line-height:1.08;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 24px rgba(0,0,0,.6)}
#title.has{cursor:pointer}
.hint{margin:0;min-height:1em;font-size:.76rem;color:var(--mute)}
#lyrics{display:none;width:100%;max-height:45dvh;overflow:auto;padding:16px;border-radius:14px;background:rgba(10,11,16,.72);backdrop-filter:blur(8px);white-space:pre-wrap;line-height:1.7}
.foot{font-size:.85rem;color:var(--mute);min-height:1.2em}
.foot b{color:var(--ink);font-weight:700}

#gate{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:rgba(8,9,14,.8);backdrop-filter:blur(10px);font-size:1.3rem;font-weight:800;letter-spacing:.06em;text-align:center}
#gate.show{display:flex}
.play{width:92px;height:92px;border-radius:50%;background:var(--acc);display:grid;place-items:center;animation:ring 1.8s infinite}
.play::before{content:"";margin-left:8px;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent #1a0f08}

@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.7)}70%{box-shadow:0 0 0 9px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes ring{0%{box-shadow:0 0 0 0 hsl(var(--h) 92% 62% / .6)}70%{box-shadow:0 0 0 26px hsl(var(--h) 92% 62% / 0)}100%{box-shadow:0 0 0 0 hsl(var(--h) 92% 62% / 0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="veil"></div>

<main>
  <header>
    <div class="brand">Radio Altimiras</div>
    <div class="live"><div class="eq"><i></i><i></i><i></i><i></i></div><span class="dot"></span><span id="liveTxt">Al aire</span></div>
  </header>

  <section class="stage">
    <div class="art"><img id="cover" class="hide" alt="Carátula de la canción"></div>
    <div><span class="genre" id="genre"></span></div>
    <h1 id="title">Sintonizando…</h1>
    <p class="hint" id="hint"></p>
    <div id="lyrics"></div>
  </section>

  <footer class="foot" id="next"></footer>
</main>

<div id="gate"><div class="play"></div><div>Toca para sintonizar</div></div>
<audio id="player" preload="auto"></audio>

<script>
(async function(){
"use strict";
const $=id=>document.getElementById(id);
const COVERS="https://raw.githubusercontent.com/altimiras/Radio/main/imagenes/";
const player=$("player"),cover=$("cover"),bg=$("bg"),title=$("title"),genre=$("genre"),
      hint=$("hint"),lyrics=$("lyrics"),nextEl=$("next"),gate=$("gate"),liveTxt=$("liveTxt");
let songs=[],cur=0,tk=0,errs=0,hasL=false,live=false,skew=0,seek=0;

function coverUrl(t){
  return COVERS+encodeURIComponent(String(t||"").replace(/[\\\/:*?"<>|]/g,"_").trim())+".jpg";
}
function hueOf(s){let h=7;for(const c of String(s||"radio"))h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function placeholder(h){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h+',70%,45%)"/><stop offset="1" stop-color="hsl('+((h+50)%360)+',70%,18%)"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="200" y="262" font-size="190" text-anchor="middle" fill="rgba(255,255,255,.85)" font-family="sans-serif">♪</text></svg>';
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

function applyCover(url,real,song){
  cover.src=url;
  bg.style.backgroundImage='url("'+url+'")';
  cover.classList.remove("hide");
  if(real&&"mediaSession" in navigator){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:song.titulo||"",artist:song.ritmo||"Radio Altimiras",album:"Radio Altimiras",artwork:[{src:url,sizes:"512x512",type:"image/jpeg"}]})}catch(e){}
  }
}
function setCover(song,h){
  const url=coverUrl(song.titulo),t=++tk,img=new Image();
  cover.classList.add("hide");
  img.onload=function(){if(t===tk)applyCover(url,true,song)};
  img.onerror=function(){if(t===tk)applyCover(placeholder(h),false,song)};
  img.src=url;
}
function setHint(){
  hint.textContent=hasL?(lyrics.style.display==="block"?"Toca el título para ocultar la letra":"Toca el título para ver la letra"):"";
  title.classList.toggle("has",hasL);
}

function total(){return songs.reduce(function(a,x){return a+x.duracion},0)}
function where(){
  let t=(((Date.now()+skew)/1000)%total()+total())%total();
  for(let i=0;i<songs.length;i++){if(t<songs[i].duracion)return {i:i,off:t};t-=songs[i].duracion}
  return {i:0,off:0};
}
function advance(){
  if(!live){show(cur+1,true);return}
  const w=where();let i=w.i,off=w.off;
  if(i===cur){i=(cur+1)%songs.length;off=0}
  else if(off<3)off=0;
  show(i,true,off);
}
function show(i,autoplay,off){
  if(!songs.length)return;
  cur=(i+songs.length)%songs.length;
  const s=songs[cur],h=hueOf(s.ritmo),n=songs[(cur+1)%songs.length];
  document.documentElement.style.setProperty("--h",h);
  title.textContent=s.titulo||"Sin título";
  document.title=(s.titulo||"Radio")+" · Radio Altimiras";
  genre.textContent=s.ritmo||"";
  hasL=typeof s.letra==="string"&&s.letra.trim().length>0;
  lyrics.textContent=hasL?s.letra:"";lyrics.style.display="none";setHint();
  nextEl.textContent="";
  if(songs.length>1){
    nextEl.append("A continuación · ");
    const b=document.createElement("b");b.textContent=n.titulo||"";nextEl.appendChild(b);
    new Image().src=coverUrl(n.titulo);
  }
  setCover(s,h);
  seek=off>0?off:0;
  player.src=s.archivo;
  if(autoplay)tryPlay();
}

function tryPlay(){
  const p=player.play();
  if(p&&p.catch)p.catch(function(e){if(e&&e.name==="NotAllowedError")gate.classList.add("show")});
}
gate.addEventListener("click",function(){
  gate.classList.remove("show");
  if(live){const w=where();show(w.i,true,w.off)}else tryPlay();
});
player.addEventListener("loadedmetadata",function(){
  if(seek>0){try{player.currentTime=Math.min(seek,(player.duration||seek+1)-1)}catch(e){}seek=0}
});
document.addEventListener("visibilitychange",function(){
  if(document.hidden||!live||!songs.length)return;
  const w=where();
  if(w.i!==cur||Math.abs(player.currentTime-w.off)>8)show(w.i,true,w.off);
});

title.addEventListener("click",function(){
  if(!hasL)return;
  const open=lyrics.style.display!=="block";
  lyrics.style.display=open?"block":"none";setHint();
  if(open)lyrics.scrollIntoView({behavior:"smooth",block:"nearest"});
});

player.addEventListener("ended",advance);
player.addEventListener("playing",function(){errs=0;document.body.classList.add("on");liveTxt.textContent="Al aire"});
player.addEventListener("pause",function(){document.body.classList.remove("on")});
player.addEventListener("error",function(){
  errs++;document.body.classList.remove("on");
  if(errs>=songs.length){title.textContent="La radio está fuera del aire";liveTxt.textContent="Sin señal";hint.textContent="No se pudo cargar ninguna canción.";return}
  setTimeout(advance,1500);
});

if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("nexttrack",function(){show(cur+1,true)});
    navigator.mediaSession.setActionHandler("previoustrack",function(){show(cur-1,true)});
  }catch(e){}
}

function diagnostico(){
  const d=document.createElement("pre");
  d.style.cssText="position:fixed;left:8px;bottom:8px;z-index:9;margin:0;padding:8px;background:rgba(0,0,0,.75);color:#9f9;font:11px/1.35 monospace;border-radius:8px;max-width:92vw;white-space:pre-wrap";
  document.body.appendChild(d);
  setInterval(function(){
    const w=live?where():null;
    d.textContent="modo: "+(live?"en vivo":"sin duraciones (desde el inicio)")+
      "\nreloj corregido: "+(skew/1000).toFixed(1)+" s"+
      "\ncanciones: "+songs.length+(live?" · ciclo "+Math.round(total())+" s":"")+
      "\nsuena: "+(cur+1)+" · "+player.currentTime.toFixed(1)+" s"+
      (w?"\nesperado: "+(w.i+1)+" · "+w.off.toFixed(1)+" s":"");
  },1000);
}

try{
  const t0=Date.now();
  const r=await fetch("playlist.json?t="+t0,{cache:"no-store"});
  const t1=Date.now();
  if(!r.ok)throw new Error("No se pudo leer playlist.json");
  const dh=Date.parse(r.headers.get("Date")||"");
  if(!isNaN(dh))skew=dh+500+(parseInt(r.headers.get("Age"),10)||0)*1000-(t0+t1)/2;
  const d=await r.json();
  songs=(Array.isArray(d)?d:d.canciones)||[];
  songs=songs.filter(function(s){return s&&s.archivo});
  if(!songs.length)throw new Error("La programación no contiene canciones");
  live=songs.every(function(x){return +x.duracion>0});
  if(live){const w=where();show(w.i,true,w.off<1?0:w.off)}else show(0,true);
  if(/[?&]diag/.test(location.search))diagnostico();
}catch(e){
  title.textContent="No se pudo iniciar la radio";
  hint.textContent=e.message;liveTxt.textContent="Sin señal";
}
})();
</script>
</body>
</html>
